name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true  # 1. 从 GitHub 下载真实的图片文件

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 2. 配置 Git 用户 (LFS 传输有时需要)
          git config --global user.email "104133192+sunnyspot114514@users.noreply.github.com"
          git config --global user.name "sunnyspot114514"

          # 3. 安装 LFS
          git lfs install

          # 4. 设置 Hugging Face 远程仓库地址
          # 我们把这个地址命名为 'hf'，方便后面引用
          git remote add hf https://sunny114514:$HF_TOKEN@huggingface.co/spaces/sunny114514/PhD-Scout

          # 5. 【关键修复】显式推送 LFS 对象
          # 这条命令会强制把图片先传到 Hugging Face 的 LFS 服务器
          git lfs push --all hf main

          # 6. 最后推送代码
          # 此时图片已经传完了，这里只传代码和指针，HF 就不会报错了
          git push -f hf main