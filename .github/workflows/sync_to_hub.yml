name: Sync to Hugging Face hub
on:
  push:
    branches: [main]  # 这里根据你的主分支名字改，可能是 master 或 main

  # 允许手动触发
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}  # 刚才在 GitHub 设置的 Secret
        run: |
          git lfs install
          git push -f https://sunny114514:$HF_TOKEN@huggingface.co/spaces/sunny114514/PhD-Scout main