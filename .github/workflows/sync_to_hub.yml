name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -U huggingface_hub

      - name: Push to Hub via Python SDK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: sunny114514
          HF_SPACE_NAME: PhD-Scout
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          # --- 1. 定义你要注入的 Hugging Face 配置头 ---
          # 可以在这里随心所欲地修改配置，不用动本地文件
          hf_header = \"\"\"---
          title: PhD Scout AI Agent
          emoji: 🎓
          colorFrom: blue
          colorTo: indigo
          sdk: docker
          pinned: false
          app_port: 8501
          ---
          \"\"\"

          # --- 2. 读取当前的 README ---
          try:
              with open('README.md', 'r', encoding='utf-8') as f:
                  original_content = f.read()
          except FileNotFoundError:
              original_content = \"# PhD Scout\"

          # --- 3. 拼接并写入 (只在临时的 Docker 容器里修改，不影响 GitHub) ---
          with open('README.md', 'w', encoding='utf-8') as f:
              f.write(hf_header + \"\\n\" + original_content)
          
          print('Automatically injected HF metadata into README.md')

          # --- 4. 开始上传 ---
          api = HfApi(token=os.environ['HF_TOKEN'])
          repo_id = f\"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}\"
          
          print(f'Starting upload to {repo_id}...')
          
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=['.git', '.github']
          )
          
          print('Upload complete!')
          "