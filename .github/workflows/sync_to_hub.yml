name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      # 1. 下载代码（开启 LFS，把真实图片下载下来）
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      # 2. 设置 Python 环境
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. 安装 Hugging Face 官方工具 (带 Xet 支持)
      - name: Install dependencies
        run: pip install -U huggingface_hub

      # 4. 使用 Python 脚本同步 (核心步骤)
      - name: Push to Hub via Python SDK
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          # 你的 HF 用户名
          HF_USERNAME: sunny114514
          # 你的 HF Space 名字
          HF_SPACE_NAME: PhD-Scout
        run: |
          python -c "
          from huggingface_hub import HfApi
          import os

          api = HfApi(token=os.environ['HF_TOKEN'])
          
          repo_id = f\"{os.environ['HF_USERNAME']}/{os.environ['HF_SPACE_NAME']}\"
          
          print(f'Starting upload to {repo_id}...')
          
          # upload_folder 会自动处理大文件、LFS/Xet 以及增量更新
          api.upload_folder(
              folder_path='.',
              repo_id=repo_id,
              repo_type='space',
              ignore_patterns=['.git', '.github'] # 忽略 git 自身目录
          )
          
          print('Upload complete!')
          "