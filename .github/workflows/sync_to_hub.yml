name: Sync to Hugging Face hub
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true  # 1. 依然开启 LFS 以便从 GitHub 下载图片

      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # 2. 配置 Git 用户
          git config --global user.email "104133192+sunnyspot114514@users.noreply.github.com"
          git config --global user.name "sunnyspot114514"

          # 3. 【核心修改】安装 git-xet 工具
          # 使用官方文档提供的安装脚本
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/huggingface/xet-core/refs/heads/main/git_xet/install.sh | sudo sh

          # 4. 在当前仓库初始化 Xet
          # 这会让 git 知道如何处理大文件
          git xet install

          # 5. 添加远程仓库
          git remote add hf https://sunny114514:$HF_TOKEN@huggingface.co/spaces/sunny114514/PhD-Scout

          # 6. 强制推送
          # 有了 git-xet，普通的 git push 就能自动处理大文件了，不需要手动 git lfs push
          git push -f hf main                    